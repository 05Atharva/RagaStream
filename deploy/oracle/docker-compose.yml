# RagaStream API on one VM: the backend image + Caddy for automatic HTTPS.
# Run by deploy/oracle/setup.sh. Settings come from ./.env (created by the script).
services:
  api:
    build: ../../backend
    env_file: .env
    environment:
      PORT: "8000"
      # Bind-mounted read-write, so yt-dlp can save refreshed cookies back.
      YTDLP_COOKIES_FILE: /run/cookies/cookies.txt
    volumes:
      - ./cookies.txt:/run/cookies/cookies.txt
    expose:
      - "8000"
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data: {}
  caddy_config: {}
